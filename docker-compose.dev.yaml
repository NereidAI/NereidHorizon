#
# Local docker build stack (test environment) — SEPARATE from the production
# docker-compose.yaml (ghcr images). Every resource is isolated from prod:
#   - unique container names (suffix "-dev")
#   - unique host ports (frontend :8091, pg :5434)
#   - unique volumes / network created by the "nereid-dev" project name.
#
# Use via:  make docker-dev-up / docker-dev-down / ...
# These define their own postgres + locally built backend/frontend.
#
services:
  postgres:
    container_name: nereidhorizon-postgres-dev
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=nereid
      - POSTGRES_USER=nereid
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nereidpass}
    volumes:
      - postgres-data-dev:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nereid -d nereid"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nereidhorizon-backend:
    container_name: nereidhorizon-backend-dev
    build:
      context: .
      target: backend
    image: nereidhorizon-backend:0.0.0-dev
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-../.deployment/deploy-values/nereidhorizon/backend.env}
    environment:
      - NODE_ENV=development
      - PORT=3001
      - NEREIDHORIZON_LOG_DIR=/app/logs
      - NEREIDHORIZON_SESSION_KEY_FILE=/app/state/session.key
      - DATABASE_URL=postgres://nereid:${POSTGRES_PASSWORD:-nereidpass}@postgres:5432/nereid
      - SESSION_TTL=86400
      - SESSION_ABS_TTL=28800
      # Optional hex key; otherwise use persistent mounted state/session.key.
      - SESSION_ENC_KEY=${SESSION_ENC_KEY:-}
      # Optional OpenID Connect SSO; unset OIDC_ISSUER to disable.
      - OIDC_ISSUER=${OIDC_ISSUER:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_REDIRECT_URI=${OIDC_REDIRECT_URI:-}
      - OIDC_LOCAL_LOGIN_ENABLED=${OIDC_LOCAL_LOGIN_ENABLED:-true}
      - OIDC_INSECURE_SKIP_VERIFY=${OIDC_INSECURE_SKIP_VERIFY:-false}
    volumes:
      - ${DEV_LOG_DIR:-../.deployment/deploy-logs/nereidhorizon/dev}:/app/logs
      - ${DEV_STATE_DIR:-../.deployment/deploy-values/nereidhorizon/state/dev}:/app/state
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nereidhorizon-frontend:
    container_name: nereidhorizon-frontend-dev
    build:
      context: .
      target: frontend
    image: nereidhorizon-frontend:0.0.0-dev
    restart: unless-stopped
    ports:
      - "8091:80"
    volumes:
      # Override the prod nginx config (which proxies to the prod *backend* and
      # forces TLS) with a dev variant that proxies to this dev backend over HTTP.
      - ./docker/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nereidhorizon-backend:
        condition: service_healthy

volumes:
  postgres-data-dev:
