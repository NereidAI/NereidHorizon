name: Release
description: Cut a new release of NereidHorizon
title: "Release v"
labels: [release]
body:
  - type: input
    id: version
    attributes:
      label: Version (e.g. 0.0.4)
    validations:
      required: true
  - type: textarea
    id: changelog
    attributes:
      label: Changelog summary
    validations:
      required: true
