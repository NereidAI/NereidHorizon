# Tag-only image publication (root treaty §19). One reusable-workflow call per
# multi-stage build target; the repository has no VERSION file and the git tag
# is the single version source. The organization workflow owns tag/VERSION
# derivation (v0.0.1 -> bare 0.0.1), the amd64+arm64 index, the three-tag
# scheme (no latest) and GHCR login, so this caller passes no VERSION
# build-arg. No release event or manual dispatch path remains.
#
# Each caller passes a distinct gha cache-scope matching the ci.yml warm job:
# without named scopes the two images' gha cache indexes overwrite each other.
name: Publish Images

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - target: backend
            image: nereidhorizon-backend
          - target: frontend
            image: nereidhorizon-frontend
    uses: NereidAI/.github/.github/workflows/release-image.yml@v1
    with:
      image-name: ${{ matrix.image }}
      target: ${{ matrix.target }}
      # Must match the ci.yml warm step's gha scope for this image exactly.
      cache-scope: ${{ matrix.image }}
