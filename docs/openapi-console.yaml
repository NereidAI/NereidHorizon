        '502': { $ref: '#/components/responses/BadGateway' }

  /api/forge/models/{name}/versions:
    get:
      tags: [Model Distribution]
      summary: List a NereidForge model's versions (newest first)
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
