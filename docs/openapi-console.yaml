  /api/mms/objects/{type}/{id}/destinations:
    get:
      tags: [Model Distribution]
      summary: Per-destination delivery status of one MMS object
      parameters:
        - { name: org, in: query, required: true, schema: { type: string } }
        - { name: type, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Delivery status list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MmsDestStatus' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /api/mms/objects/{type}/{id}:
    delete:
      tags: [Model Distribution]
      summary: Delete an MMS object (metadata + data)
      parameters:
        - { name: org, in: query, required: true, schema: { type: string } }
        - { name: type, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /api/mms/publish:
    post:
      tags: [Model Distribution]
      summary: Publish a Forge precision package to edge nodes through ESS
      description: |
        Platform only. Requires a non-root `org` query parameter. The payload
        is exactly the gzip tar Forge produced automatically for
        `precision` at optimization-job end; the BFF streams it from Forge
        into ESS byte-for-byte without disk or whole-model buffering and never
        repackages anything. The precision package must exist and be ready
        (Forge 404/409 otherwise); the call stays open until the upload
        finishes. NereidInference on the edge extracts and installs the
        package after ESS lands it.
      parameters:
        - { name: org, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modelName, version, precision, objectType, objectID, destinations]
              properties:
                modelName: { type: string }
                version: { type: string }
                precision: { type: string, enum: [fp32, fp16, int8], example: fp16 }
                objectType: { type: string, example: openvino }
                objectID: { type: string, example: yolov8n-fp16 }
                destinations:
                  type: array
                  items: { type: string, example: 'edgex:NUC' }
                description: { type: string }
      responses:
        '200':
          description: Publish accepted and data uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  objectType: { type: string }
                  objectID: { type: string }
                  bytes:
                    type: integer
                    description: Package size in bytes (from the Forge Content-Length; 0 if absent).
                  destinationCount: { type: integer }
                  precision: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/NotConfigured' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /api/mms/upload:
    post:
      tags: [Model Distribution]
      summary: Validate and distribute an operator-uploaded standard model package
      description: |
        Platform only. Requires a non-root `org` query parameter and CSRF.
        Exactly one multipart file field named `package` contains the original
        `.tar.gz`; `destinations` is a JSON-encoded string array. The BFF spools
        to a private temporary file, validates `nereid-model/1`, safe entries,
        complete artifact declarations, exact sizes and SHA-256 digests, then
        streams the unchanged bytes to ESS. The spool is removed on success and
        failure. `operationID` correlates all audit stages for this operation.
      parameters:
        - { name: org, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [package, objectType, objectID, destinations]
              properties:
                package: { type: string, format: binary }
                objectType: { type: string, example: openvino }
                objectID: { type: string, example: demo-1.2.3-a1b2c3d4 }
                destinations:
                  type: string
                  example: '["edgex:node1"]'
                  description: JSON-encoded ESS destinationType:destinationID string array.
                description: { type: string }
      responses:
        '200':
          description: Package validated and original bytes uploaded to ESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomPackageResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Compressed package exceeds MMS_UPLOAD_MAX_BYTES
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /api/mms/from-url:
    post:
      tags: [Model Distribution]
      summary: Download, validate and distribute a standard model package from a URL
      description: |
        Platform only. The URL must be HTTP(S), must not contain embedded
        credentials, and its Origin must appear in
        `MMS_MODEL_URL_ALLOWED_ORIGINS`. Redirects are limited and each target
        Origin is revalidated. Signed query strings are used for the download
        but never returned or audited; only the final Origin is recorded and the
        remote path is not used as a filename. The downloaded package follows
        exactly the same spool, validation, ESS
        byte-stream and cleanup transaction as a local upload.
      parameters:
        - { name: org, in: query, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, objectType, objectID, destinations]
              properties:
                url: { type: string, format: uri }
                objectType: { type: string, example: openvino }
                objectID: { type: string, example: demo-1.2.3-a1b2c3d4 }
                destinations:
                  type: array
                  items: { type: string, example: 'edgex:node1' }
                description: { type: string }
      responses:
        '200':
          description: URL package validated and original bytes uploaded to ESS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomPackageResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413':
          description: Download exceeds MMS_UPLOAD_MAX_BYTES
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: URL distribution has no configured allowed Origins
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # =============================================================
  # Service-to-service model distribution API (scoped API key)
  # =============================================================
  /api/service/v1/orgs/{org}/model-publications:
    post:
      tags: [Service Model API]
      summary: Publish one ready Forge precision package through ESS
      description: |
        Service-to-service endpoint authenticated with an `X-Api-Key` that
        contains the `model:distribute` scope. It does not accept console
        session cookies and does not require CSRF tokens.

        The key is bound to one org; `{org}` must match that binding and must
        not be `root`. NH uses its stored Exchange credential to publish, then
        independently reads the stored ESS bytes and verifies both SHA-256 and
        byte count against the Forge package record. On mismatch, NH deletes
        the newly created ESS object and returns 502.

        A successful response means `acceptance: "ess_received"` and
        `edgeReady: false`: ESS has received the bytes, but edge nodes have not
        necessarily received or consumed the object. Poll the destination
        endpoint for terminal delivery state.
      operationId: createServiceModelPublication
      security:
        - ServiceApiKey: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
          example: myorg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelPublicationRequest'
      responses:
        '200':
          description: ESS received the package and the stored bytes matched the Forge record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelPublicationResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Forge is not configured, the requested precision package is not ready, or an ESS object with the same type and id already exists
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502':
          description: Forge/ESS transport failed or stored ESS bytes failed integrity verification
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: Exchange is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/service/v1/orgs/{org}/objects/{type}/{id}/destinations:
    get:
      tags: [Service Model API]
      summary: Query per-destination delivery state of one ESS model object
      description: |
        Requires the same org-bound `model:distribute` API key. `edgeReady` is
        true only when every reported destination is `delivered` or
        `consumed`. An empty or pending destination list remains
        `in_progress`; ESS acceptance alone is never reported as edge ready.
      operationId: getServiceObjectDestinations
      security:
        - ServiceApiKey: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: type
          in: path
          required: true
          schema:
            type: string
          example: face-detection
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: yunet-fp16
      responses:
        '200':
          description: Aggregate delivery state and raw ESS destination records
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObjectDeliveryStatus'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: Exchange is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # ----- nh-model-distribution/v1: idempotent ensure task contract -----
  /api/service/v1/orgs/{org}/distribution-tasks:
    post:
      tags: [Service Model API]
      summary: Ensure one model package is distributed (idempotent task handle)
      description: |
        Versioned idempotent distribution contract (`nh-model-distribution/v1`),
        authenticated with the same org-bound `model:distribute` API key as the
        legacy model-publications endpoint.

        The idempotency key is the ESS object identity (`org` + `objectType` +
        `objectID`). A repeated call while a task is active (`in_progress` or
        `delivered`) returns that same task with `idempotentReplay: true` and
        never republishes. When the ESS object already exists without a task
        (legacy publication or manual preload), NH verifies its bytes against
        the Forge package digest and adopts it (`adopted: true`) instead of
        returning the legacy duplicate 409; mismatched bytes still return 409.

        `precision` (fp32/fp16/int8) is the hardware-aware payload selector: one IR
        per precision serves every edge device, so no per-application parameter
        exists. A created task answers `201`; an idempotent replay answers
        `200`. Terminal tasks (`failed`/`cancelled`/`rolled_back`) release the
        idempotency key, so a later ensure may create a new task.
      operationId: ensureDistributionTask
      security:
        - ServiceApiKey: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
          example: myorg
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributionTaskRequest'
      responses:
        '200':
          description: Idempotent replay of the existing active task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionTask'
        '201':
          description: Task created (fresh publication or verified ESS adoption)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionTask'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Forge not configured, precision package not ready, or an existing ESS object has mismatched bytes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: Exchange is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/service/v1/orgs/{org}/distribution-tasks/{taskId}:
    get:
      tags: [Service Model API]
      summary: Poll one distribution task and its live ESS delivery state
      description: |
        Returns the task handle. Active tasks are refreshed from ESS: the task
        flips to `delivered` once every destination reports `delivered` or
        `consumed`, after which no further ESS calls are made. Terminal tasks
        are served from the database.
      operationId: getDistributionTask
      security:
        - ServiceApiKey: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
          example: dt_1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
      responses:
        '200':
          description: Task handle with delivery state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionTask'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown task id in this org
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: Exchange is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/service/v1/orgs/{org}/distribution-tasks/{taskId}/cancel:
    post:
      tags: [Service Model API]
      summary: Cancel an in-flight distribution and delete its ESS object
      description: |
        Legal only while the task is `in_progress`. NH first checks live ESS
        destinations: if every destination already delivered, the task flips
        to `delivered` and the call answers 409 directing the caller to
        rollback. Otherwise the ESS object is deleted (an already-gone object
        is treated as success) and the task becomes `cancelled`, releasing
        the idempotency key.
      operationId: cancelDistributionTask
      security:
        - ServiceApiKey: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task cancelled and ESS object deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionTask'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown task id in this org
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Task already delivered or not cancellable in its current state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: Exchange is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /api/service/v1/orgs/{org}/distribution-tasks/{taskId}/rollback:
    post:
      tags: [Service Model API]
      summary: Roll back a delivered distribution by deleting its ESS object
      description: |
        Legal only for a `delivered` task. The ESS object is deleted so edge
        nodes drop it; an already-gone object (404) counts as success. The
        task becomes `rolled_back` and releases the idempotency key.
      operationId: rollbackDistributionTask
      security:
        - ServiceApiKey: []
      parameters:
        - name: org
          in: path
          required: true
          schema:
            type: string
        - name: taskId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Distribution rolled back and ESS object deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistributionTask'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Unknown task id in this org
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Task is not in the delivered state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '502': { $ref: '#/components/responses/BadGateway' }
        '503':
          description: Exchange is not configured
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

components:
  responses:
    AuthError:
      description: Not authenticated
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient role or permission
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    BadGateway:
      description: Upstream (NereidForge or ESS) failure
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotConfigured:
      description: Integration is not configured
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: nereid_sid
      description: HttpOnly; SameSite=Strict session cookie issued on login.
    CsrfToken:
      type: apiKey
      in: header
      name: X-Csrf-Token
      description: CSRF token (hex string) returned by login. Required on all mutating requests (POST/PUT/PATCH/DELETE) that carry a session cookie.
    ServiceApiKey:
      type: apiKey
      in: header
      name: X-Api-Key
      description: |
        Org-bound NH API key. Service model API calls require the
        `model:distribute` scope and are authenticated independently of console
        session cookies and CSRF tokens.

  parameters:
    OrgQuery:
      name: org
      in: query
      required: false
      schema:
        type: string
      description: Target org ID for cross-org queries
      example: myorg

  schemas:
    Error:
      type: object
      properties:
        msg:
          type: string
        operationID:
          type: string
          description: Present for custom-package failures; correlates audit stages.
      required: [msg]
    ApiKeyScope:
      type: string
      enum: [partner:read, model:distribute]
      description: |
        partner:read permits only the read-only partner API;
        model:distribute permits the narrow service-to-service model API.
    ModelPublicationRequest:
      type: object
      required: [modelName, version, precision, objectType, objectID, destinations]
      properties:
        modelName: { type: string, example: yunet }
        version: { type: string, example: '0.0.1' }
        precision: { type: string, enum: [fp32, fp16, int8], example: fp16 }
        objectType: { type: string, example: face-detection }
        objectID:
          type: string
          example: yunet-fp16
          description: Unique ESS object id within objectType. Existing identities return 409; use distinct ids for distinct packages.
        destinations:
          type: array
          minItems: 1
          items: { type: string, example: 'openhorizon.edgenode:node1' }
        description: { type: string }
    ModelPublicationResponse:
      type: object
      required:
        [objectType, objectID, bytes, destinationCount, precision, packageSHA256,
         storedObject, byteIntegrity, acceptance, edgeReady]
      properties:
        objectType: { type: string }
        objectID: { type: string }
        modelName: { type: string }
        version: { type: string }
        precision: { type: string, enum: [fp32, fp16, int8] }
        bytes: { type: integer, description: Forge package byte count. }
        destinationCount: { type: integer }
        packageSHA256: { type: string, pattern: '^[0-9a-f]{64}$' }
        storedObject:
          type: object
          required: [sha256, bytes]
          properties:
            sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
            bytes: { type: integer }
        byteIntegrity: { type: string, enum: [match] }
        acceptance:
          type: string
          enum: [ess_received]
          description: ESS has received and stored the bytes; it is not an edge-ready state.
        edgeReady:
          type: boolean
          enum: [false]
          description: Always false in the publication response. Poll destination status to determine edge readiness.
    ObjectDeliveryStatus:
      type: object
      required: [org, objectType, objectID, deliveryState, edgeReady, destinations]
      properties:
        org: { type: string }
        objectType: { type: string }
        objectID: { type: string }
        deliveryState:
          type: string
          enum: [in_progress, delivered, error]
        edgeReady:
          type: boolean
          description: True only when every destination status is delivered or consumed.
        destinations:
          type: array
          items: { $ref: '#/components/schemas/MmsDestStatus' }
    DistributionTaskRequest:
      type: object
      description: Ensure request for nh-model-distribution/v1. Same envelope as ModelPublicationRequest; the ESS object identity is the idempotency key.
      required: [modelName, version, precision, objectType, objectID, destinations]
      properties:
        modelName: { type: string, example: yunet }
        version: { type: string, example: '0.0.1' }
        precision:
          type: string
          enum: [fp32, fp16, int8]
          example: fp16
          description: Hardware-aware payload selector; one IR per precision serves every edge device.
        objectType: { type: string, example: face-detection }
        objectID:
          type: string
          example: yunet-fp16
          description: ESS object id unique within objectType; together with org and objectType it is the ensure idempotency key.
        destinations:
          type: array
          minItems: 1
          items: { type: string, example: 'openhorizon.edgenode:node1' }
        description: { type: string }
    DistributionTask:
      type: object
      required:
        [taskId, org, objectType, objectID, modelName, version, precision,
         destinations, state, deliveryState, edgeReady, failureReason,
         packageSHA256, packageBytes, createdAt, updatedAt, deliveredAt, finishedAt]
      properties:
        taskId:
          type: string
          example: dt_1b9d6bcd-bbfd-4b2d-9b5d-ab8dfbbd4bed
          description: Opaque pollable task handle.
        org: { type: string }
        objectType: { type: string }
        objectID: { type: string }
        modelName: { type: string }
        version: { type: string }
        precision: { type: string, enum: [fp32, fp16, int8] }
        destinations:
          type: array
          items: { type: string }
          description: Requested destination ids captured at ensure time.
        state:
          type: string
          enum: [in_progress, delivered, failed, cancelled, rolled_back]
          description: Task lifecycle state. in_progress and delivered hold the idempotency key.
        deliveryState:
          type: string
          enum: [in_progress, delivered, error, cancelled, rolled_back]
          description: ESS-derived aggregate delivery for active tasks; mirrors state for terminal tasks.
        edgeReady:
          type: boolean
          description: True only when every destination status is delivered or consumed.
        delivery:
          type: array
          description: Raw ESS destination records from the latest refresh; empty for terminal tasks.
          items: { $ref: '#/components/schemas/MmsDestStatus' }
        failureReason: { type: string, nullable: true }
        packageSHA256: { type: string, nullable: true, pattern: '^[0-9a-f]{64}$' }
        packageBytes: { type: integer, nullable: true }
        idempotentReplay:
          type: boolean
          description: Present and true when the ensure call returned an existing active task.
        adopted:
          type: boolean
          description: Present and true when an already-existing verified ESS object was adopted into a task.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deliveredAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
    CustomPackageResult:
      type: object
      required: [operationID, objectType, objectID, bytes, destinationCount, packageSHA256, expandedBytes, fileCount, modelID, modelVersion, originalFilename, source]
      properties:
        operationID: { type: string, format: uuid }
        objectType: { type: string }
        objectID: { type: string }
        bytes: { type: integer, description: Original compressed package size. }
        destinationCount: { type: integer }
        packageSHA256: { type: string, pattern: '^[0-9a-f]{64}$' }
        expandedBytes: { type: integer }
        fileCount: { type: integer, description: Regular-file count including the root descriptor. }
        modelID: { type: string }
        modelVersion: { type: string }
        originalFilename:
          type: string
          description: Local filename for uploads; empty for URL sources so remote paths are never disclosed or audited.
        source: { type: string, enum: [custom-upload, url] }
        sourceOrigin:
          type: string
          format: uri
          description: Final URL Origin only; never includes path, query, or credentials.
    ForgeModel:
      type: object
      description: NereidForge model registry entry (UI fields subset)
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        framework: { type: string }
        task_type: { type: string }
        created_at: { type: string, nullable: true }
        updated_at: { type: string, nullable: true }
        versions:
          type: array
          items: { $ref: '#/components/schemas/ForgeVersion' }
    ForgeVersion:
      type: object
      properties:
        version: { type: string }
        description: { type: string }
        file_path: { type: string }
        size_bytes: { type: integer }
        status: { type: string }
        created_at: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          description: Carries packages[], the per-target production package records.
    ForgePackageRecord:
      type: object
      description: |
        One ready precision package as returned by GET .../packages (Forge
        builds these automatically at optimization-job end; ready only).
      properties:
        precision: { type: string, enum: [fp32, fp16, int8], example: fp16 }
        status: { type: string, example: ready }
        package_uri: { type: string }
        package_bytes: { type: integer }
        package_sha256: { type: string }
        detection_count: { type: integer }
        devices: { type: array, items: { type: object, additionalProperties: true } }
        quality_gate_passed: { type: boolean }
        map50_baseline: { type: number }
        map50_candidate: { type: number }
    MmsDestination:
      type: object
      properties:
        destinationOrgID: { type: string }
        destinationType: { type: string, example: openhorizon.edgenode }
        destinationID: { type: string, example: NUC }
        communication: { type: string }
        codeVersion: { type: string }
    MmsObject:
      type: object
      properties:
        objectID: { type: string }
        objectType: { type: string }
        description: { type: string }
        version: { type: string }
        noData: { type: boolean }
        inactive: { type: boolean }
        destinationType: { type: string }
        destinationID: { type: string }
        destinationsList:
          type: array
          items: { type: string }
        objectSize: { type: integer }
        activationTime: { type: string, format: date-time }
        expiration: { type: string, format: date-time }
        publishedAt:
          type: string
          format: date-time
          description: Latest successful NH publication audit for this object identity; absent when no audit can be associated. ESS does not supply this timestamp.
        publishedBy: { type: string }
        publicationSource: { type: string, enum: [forge, custom-upload, url] }
        operationID: { type: string, format: uuid }
        packageSHA256: { type: string, pattern: '^[0-9a-f]{64}$' }
    MmsDestStatus:
      type: object
      properties:
        destinationType: { type: string }
        destinationID: { type: string }
        status:
          type: string
          enum: [pending, delivering, delivered, consumed, deleted, error]
        message: { type: string }
    ServiceDeploymentServices:
      type: object
      description: Deployment image definition (keyed by service name)
      properties:
        image:
          type: string
        ports:
          type: array
          items:
            type: object
            properties:
              HostPort:
                type: string
        privileged:
          type: boolean
        devices:
          type: array
          items:
            type: string
        command:
          type: array
          items:
            type: string
        entrypoint:
          type: array
          items:
            type: string
        binds:
          type: array
          items:
            type: string
        environment:
          type: object
          additionalProperties:
            type: string
        user:
          type: string
        pid:
          type: string
        ipc:
          type: string
        maxMemoryMb:
          type: integer
        maxCpus:
          type: string
        ephemeralPorts:
          type: array
          items:
            type: string
        tmpfs:
          type: object
          additionalProperties:
            type: string
        cap_add:
          type: array
          items:
            type: string
        sysctls:
          type: object
          additionalProperties:
            type: string
        logDriver:
          type: string
        secrets:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              cert:
                type: string
              seal:
                type: object

    ServiceBody:
      type: object
      required: [label, url, version, arch]
      properties:
        label:
          type: string
        description:
          type: string
        url:
          type: string
        version:
          type: string
        arch:
          type: string
        sharable:
          type: string
          enum: [single, multiple]
          default: multiple
        public:
          type: boolean
          default: false
        matchHardware:
          type: object
        requiredServices:
          type: array
          items:
            type: object
        userInput:
          type: array
          items:
            type: object
        deployment:
          type: object
          description: Deployment config (auto-stringified and signed)
          properties:
            services:
              type: object
              additionalProperties:
                $ref: '#/components/schemas/ServiceDeploymentServices'
        deploymentSignature:
          type: string
        imageStore:
          type: string
        documentation:
          type: string
        clusterDeployment:
          type: object
        clusterDeploymentSignature:
          type: string

    PService:
      type: object
      description: Service reference within a pattern
      properties:
        serviceOrgID:
          type: string
        serviceArch:
          type: string
        serviceVersions:
          type: array
          items:
            type: object
            properties:
              version:
                type: string
              priority:
                type: object
                properties:
                  priority_value:
                    type: integer
                  retries:
                    type: integer
              upgradePolicy:
                type: string
                enum: [null, immediate, never, conservative]
        nodeHealth:
          type: object
        dataVerify:
          type: string
