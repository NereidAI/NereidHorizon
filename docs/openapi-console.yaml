  /api/forge/models/{name}/versions/{version}/packages:
    get:
      tags: [Model Distribution]
      summary: List a version's ready precision packages
      description: |
        Platform only. Read-only proxy of the Forge endpoint. Forge builds
        precision packages (fp32/fp16/int8) automatically at the end of an
        optimization job — there is no build-trigger API; this returns ready
        packages only, with quality-gate and per-device verification data.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: version, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Ready precision packages
          content:
            application/json:
              schema:
                type: object
                properties:
                  packages:
                    type: array
                    items: { $ref: '#/components/schemas/ForgePackageRecord' }
        '409': { $ref: '#/components/responses/NotConfigured' }
        '502': { $ref: '#/components/responses/BadGateway' }

  /api/mms/destinations:
