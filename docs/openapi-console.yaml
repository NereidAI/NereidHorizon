          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        org: { type: string }
                        label: { type: string }
                        revoked: { type: boolean }
                        expiresAt: { type: string, format: date-time, nullable: true }
                        scopes:
                          type: array
                          items: { $ref: '#/components/schemas/ApiKeyScope' }
    post:
      tags: [Users]
      summary: Create own API key
      description: |
        Partner self-service. Creates an API key for the partner's own org.
