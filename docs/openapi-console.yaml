  # =============================================================
  # NereidSphere integration (machine-to-machine via NS gateway)
  # =============================================================
  /v1/integration/ns/tenants:
    get:
      tags: [NereidSphere Integration]
      summary: List tenants (Exchange orgs) for the NS admin console
      description: |
        Called by the NereidSphere admin console **through the NS gateway**
        (`/p/horizon/v1/integration/ns/tenants`). The gateway strips inbound
        copies and stamps `X-NS-Integration-Secret` (this product's SSO secret)
        and the verified `X-User-Roles` header; no browser session is involved.
        Deliberately outside `/api/` so the regular session/CSRF guards do not
        apply.
      operationId: listIntegrationTenants
      parameters:
        - name: X-NS-Integration-Secret
          in: header
          required: true
          description: Product SSO secret, stamped by the NS gateway only.
          schema:
            type: string
        - name: X-User-Roles
          in: header
          required: true
          description: Comma-joined NS suite roles; must contain `admin` or `operator`.
          schema:
            type: string
            example: admin,user
      responses:
        '200':
          description: Exchange org list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    tenant_id:
                      type: string
                    tenant_name:
                      type: string
                  required: [tenant_id, tenant_name]
              example:
                - tenant_id: myorg
                  tenant_name: myorg
                - tenant_id: acme-labs
                  tenant_name: acme-labs
        '401':
          description: Missing or wrong integration secret
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller lacks the admin/operator suite role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '502':
          description: Exchange org list unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/forge/status:
    get:
      tags: [Model Distribution]
      summary: NereidForge + ESS connectivity status
      description: |
        Platform only. Returns whether the NereidForge service account is
        configured/authenticated and whether the Cloud Sync Service (ESS/CSS)
        is reachable. The Forge token and Exchange credentials are never returned.
      responses:
        '200':
          description: Integration status
          content:
            application/json:
              schema:
                type: object
                properties:
                  forge:
                    type: object
                    properties:
                      configured: { type: boolean }
                      baseUrl: { type: string }
                      authenticated: { type: boolean }
                      error: { type: string }
                  ess:
                    type: object
                    properties:
                      baseUrl: { type: string }
                      reachable: { type: boolean }
                      error: { type: string }
        '401': { $ref: '#/components/responses/AuthError' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/forge/test:
    post:
      tags: [Model Distribution]
      summary: Validate Forge connection settings with a real login
      description: |
        Platform only. Performs a captcha + password login against NereidForge.
        A blank `password` reuses the already-stored service-account secret.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url, username]
              properties:
                base_url: { type: string, example: 'http://nereidforge-host:8000' }
                username: { type: string }
                password: { type: string }
                namespace: { type: string }
                tenant: { type: string, default: default }
      responses:
        '200':
